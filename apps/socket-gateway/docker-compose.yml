# Lokal dev: socket-gateway + Redis bir buyruq bilan
# Boshlash: docker compose up --build
#
# Ulanish: ws://localhost:3030/socket.io
# Health:  http://localhost:3030/health

services:
  gateway:
    build:
      context: ../..
      dockerfile: apps/socket-gateway/Dockerfile
    ports:
      - "3030:3030"
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      BACKEND_URL: ${BACKEND_URL:-https://turonkafe.duckdns.org}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      LOG_LEVEL: debug
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
