name: Secret Scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog scan (best-effort)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown --fail
