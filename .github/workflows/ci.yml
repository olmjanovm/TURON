name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint placeholder
        run: echo "No non-interactive lint config is committed yet; add ESLint config to enable lint CI."

      - name: Tests (if present)
        run: pnpm -r run test --if-present

      - name: Basic build placeholder
        run: pnpm --filter @turon/shared run build
